name: Daily School Lunch Notification

on:
  # 외부 스케줄러(cron-job.org 등)에서 workflow_dispatch로 정시 실행하도록 변경
  # (중복 알림 방지를 위해 GitHub 자체 schedule 비활성화)
  # schedule:
  #   - cron: '15 23 * * 0-4'
  workflow_dispatch: # Allows manual/API run from GitHub UI or external scheduler

jobs:
  send-menu:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Crawler
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python menu_crawler.py
